<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 图书馆管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 420px; }
        .login-box h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .login-box .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .tab-switch { display: flex; margin-bottom: 25px; border-bottom: 2px solid #eee; }
        .tab-switch button { flex: 1; padding: 12px; border: none; background: none; cursor: pointer; font-size: 16px; color: #7f8c8d; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .tab-switch button.active { color: #3498db; border-bottom-color: #3498db; font-weight: bold; }
        .tab-switch button:hover { color: #3498db; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #2c3e50; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #3498db; }
        .btn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #2980b9; }
        .error { color: #e74c3c; text-align: center; margin-bottom: 15px; padding: 8px; background: #fdecea; border-radius: 4px; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #3498db; text-decoration: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>图书馆管理系统</h2>
        <p class="subtitle">请选择登录方式</p>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="tab-switch">
            <button class="active" onclick="switchTab('reader')">读者登录</button>
            <button onclick="switchTab('admin')">管理员登录</button>
        </div>
        <div id="readerTab" class="tab-content active">
            <form action="/login" method="post">
                <input type="hidden" name="loginType" value="reader">
                <div class="form-group">
                    <label>读者号</label>
                    <input type="text" name="readerNo" placeholder="请输入读者号" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">读者登录</button>
            </form>
            <div class="back-link">
                <a href="/register">还没有账号？立即注册</a>
            </div>
        </div>
        <div id="adminTab" class="tab-content">
            <form action="/login" method="post">
                <input type="hidden" name="loginType" value="admin">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" placeholder="请输入管理员用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">管理员登录</button>
            </form>
        </div>
        <div class="back-link" style="margin-top: 15px;">
            <a href="/home">返回首页</a>
        </div>
    </div>
    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab-switch button').forEach(function(btn) {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(function(content) {
                content.classList.remove('active');
            });
            if (type === 'reader') {
                document.querySelectorAll('.tab-switch button')[0].classList.add('active');
                document.getElementById('readerTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-switch button')[1].classList.add('active');
                document.getElementById('adminTab').classList.add('active');
            }
        }
    </script>
</body>
</html>
